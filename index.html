      "@type": "PostalAddress",

      "addressCountry": "US"

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#050505;--bg2:#0a0a0a;--bg3:#111;--accent:#FF6B00;--accent-dim:rgba(255,107,0,0.15);--accent-hover:#ff8533;--text:#f0f0f0;--text-muted:#888;--card-bg:rgba(255,255,255,0.04);--card-border:1px solid rgba(255,255,255,0.08);--radius:12px}
    html{scroll-behavior:smooth}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    button{cursor:pointer;border:none;outline:none;font-family:inherit}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}
    .container{max-width:1200px;margin:0 auto;padding:0 24px}
    .section{padding:100px 0}
    .section-label{font-size:.7rem;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin-bottom:8px;font-weight:600}
    .section-title{font-family:'Oswald','Inter',sans-serif;font-size:2.5rem;font-weight:700;margin-bottom:12px;color:#fff}
    .section-subtitle{color:var(--text-muted);font-size:1rem;margin-bottom:40px;max-width:600px}
    .hero-title,.section-title,h2,.athlete-name,.coach-name,.metric-value,.package-name,.step-title{font-family:'Oswald','Inter',sans-serif}
    /* NAV */
    .nav{position:sticky;top:0;z-index:1000;background:rgba(5,5,5,0.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);padding:0 24px}
    .nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px}
    .nav-logo{font-family:'Oswald',sans-serif;font-size:1.4rem;font-weight:700;color:#fff;letter-spacing:.02em}
    .nav-logo span{color:var(--accent)}
    .nav-links{display:flex;gap:24px;list-style:none}
    .nav-links a{font-size:.82rem;color:var(--text-muted);transition:color .2s;font-weight:500}
    .nav-links a:hover,.nav-links a.active{color:var(--accent)}
    .nav-cta{background:var(--accent);color:#fff;padding:8px 18px;border-radius:8px;font-size:.82rem;font-weight:600;transition:background .2s}
    .nav-cta:hover{background:var(--accent-hover)}
    .hamburger{display:none;flex-direction:column;gap:5px;background:none;padding:8px}
    .hamburger span{width:22px;height:2px;background:#fff;border-radius:2px;transition:transform .3s}
    .mobile-menu{display:none;position:fixed;top:64px;left:0;right:0;background:rgba(10,10,10,0.97);backdrop-filter:blur(20px);padding:24px;flex-direction:column;gap:16px;z-index:999;border-bottom:1px solid rgba(255,255,255,0.06)}
    .mobile-menu.open{display:flex}
    .mobile-menu a{font-size:1rem;color:var(--text-muted);padding:8px 0;transition:color .2s}
    .mobile-menu a:hover{color:var(--accent)}
    @media(max-width:900px){.nav-links,.nav-cta{display:none}.hamburger{display:flex}}
    /* TICKER */
    .ticker{background:var(--bg2);border-bottom:1px solid rgba(255,107,0,0.2);padding:10px 0;font-size:.8rem}
    .ticker-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
    .ticker-inner strong{color:var(--accent)}
    .countdown{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
    /* HERO */
    #hero{padding:80px 0 60px;position:relative;overflow:hidden}
    .hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
    .hero-title{font-size:3.5rem;font-weight:800;line-height:1.05;margin-bottom:16px}
    .hero-title span{color:var(--accent)}
    .hero-desc{color:var(--text-muted);font-size:1rem;margin-bottom:24px;max-width:520px;line-height:1.7}
    .hero-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
    .pill{background:var(--accent-dim);color:var(--accent);padding:6px 14px;border-radius:20px;font-size:.75rem;font-weight:600}
    .hero-ctas{display:flex;gap:12px;margin-bottom:40px;flex-wrap:wrap}
    .btn{padding:14px 28px;border-radius:8px;font-size:.9rem;font-weight:600;transition:transform .2s,box-shadow .2s}
    .btn:active{transform:scale(0.97)}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-primary:hover{background:var(--accent-hover)}
    .btn-secondary{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.15)}
    .btn-secondary:hover{border-color:var(--accent);background:rgba(255,107,0,0.05)}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    .stat-item{text-align:center}
    .stat-value{font-family:'Oswald',sans-serif;font-size:1.8rem;font-weight:700;color:#fff}
    .stat-label{font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em}
    .hero-card{background:var(--card-bg);border:var(--card-border);border-radius:16px;overflow:hidden;position:relative}
    .hero-card img{width:100%;height:400px;object-fit:cover}
    .hero-card-info{padding:20px}
    .hero-card-info h3{font-size:1.2rem;font-weight:700}
    .hero-card-info p{color:var(--text-muted);font-size:.85rem}
    @media(max-width:900px){.hero-grid{grid-template-columns:1fr}.hero-title{font-size:2.2rem}.stats-grid{grid-template-columns:repeat(2,1fr)}}
    /* SYSTEM */
    .system-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:40px}
    .system-card{background:var(--card-bg);border:var(--card-border);border-radius:var(--radius);padding:28px;transition:border-color .3s,box-shadow .3s;backdrop-filter:blur(20px) saturate(1.2)}
    .system-card:hover{border-color:rgba(255,107,0,0.35);box-shadow:0 0 30px rgba(255,107,0,0.1)}
    .system-card h3{font-size:1.1rem;font-weight:700;margin-bottom:8px}
    .system-card p{color:var(--text-muted);font-size:.88rem}
    .system-icon{font-size:1.5rem;margin-bottom:12px}
    /* PROCESS */
    #process{padding:100px 0}
    .process-steps{display:flex;gap:0;position:relative;margin-top:60px}
    .process-steps::before{content:"";position:absolute;top:40px;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent),transparent);z-index:0}
    .process-step{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 12px;position:relative;z-index:1}
    .step-number{width:80px;height:80px;background:#050505;border:2px solid var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:1.5rem;font-weight:700;color:var(--accent);margin-bottom:20px;transition:background .3s,transform .3s}
    .process-step:hover .step-number{background:var(--accent);color:#fff;transform:scale(1.1)}
    .step-icon{font-size:1.5rem;margin-bottom:8px}
    .step-title{font-size:1rem;font-weight:600;margin-bottom:8px;color:#fff}
    .step-desc{font-size:.8rem;color:var(--text-muted);line-height:1.5}
    @media(max-width:768px){.process-steps{flex-direction:column;gap:32px}.process-steps::before{display:none}.process-step{flex-direction:row;text-align:left;align-items:flex-start;gap:16px}.step-number{width:50px;height:50px;font-size:1rem;flex-shrink:0}}
    /* DRAFT BOARD */
    .tabs{display:flex;gap:8px;margin-bottom:32px;flex-wrap:wrap}
    .tab-btn{padding:10px 20px;border-radius:8px;background:var(--card-bg);color:var(--text-muted);font-size:.85rem;font-weight:600;border:var(--card-border);transition:all .2s;cursor:pointer}
    .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .tab-content{display:none;opacity:0;transition:opacity .3s}
    .tab-content.active{display:block;opacity:1}
    .search-input{width:100%;max-width:400px;padding:12px 16px;background:var(--card-bg);border:var(--card-border);border-radius:8px;color:#fff;font-size:.9rem;margin-bottom:24px;font-family:inherit}
    .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,107,0,0.15);outline:none}
    .athletes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
    .athlete-card{background:var(--card-bg);border:var(--card-border);border-radius:var(--radius);padding:24px;transform-style:preserve-3d;transition:transform .3s,border-color .3s,box-shadow .3s;backdrop-filter:blur(20px) saturate(1.2)}
    .athlete-card:hover{border-color:rgba(255,107,0,0.35);box-shadow:0 0 30px rgba(255,107,0,0.15)}
    .athlete-name{font-size:1.15rem;font-weight:700;margin-bottom:4px}
    .athlete-pos{color:var(--accent);font-size:.8rem;font-weight:600;margin-bottom:12px}
    .athlete-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .athlete-stat{font-size:.8rem;color:var(--text-muted)}
    .athlete-stat strong{color:#fff}
    .metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-top:20px}
    .mini-card{background:var(--card-bg);border:var(--card-border);border-radius:var(--radius);padding:20px;text-align:center;backdrop-filter:blur(20px) saturate(1.2);transition:border-color .3s,box-shadow .3s}
    .mini-card:hover{border-color:rgba(255,107,0,0.35);box-shadow:0 0 20px rgba(255,107,0,0.1)}
    .mini-card .metric-value{font-size:1.8rem;font-weight:700;color:var(--accent)}
    .mini-card .metric-label{font-size:.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
    #alumni-results,#board-results{margin-top:16px}
    /* RAS BOARD */
    .ras-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-top:40px}
    .ras-card{background:var(--card-bg);border:var(--card-border);border-radius:var(--radius);padding:20px;text-align:center;backdrop-filter:blur(20px) saturate(1.2);transition:border-color .3s,box-shadow .3s}
    .ras-card:hover{border-color:rgba(255,107,0,0.4);box-shadow:0 0 30px rgba(255,107,0,0.15)}
    .ras-score{font-family:'Oswald',sans-serif;font-size:2rem;font-weight:700;color:var(--accent)}
    .ras-name{font-size:.9rem;font-weight:600;color:#fff;margin-top:8px}
    .ras-pos{font-size:.75rem;color:var(--text-muted)}
    .ras-rings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-top:40px}
    .ras-ring-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px;background:var(--card-bg);border:var(--card-border);border-radius:var(--radius);transition:border-color .3s,box-shadow .3s;backdrop-filter:blur(20px) saturate(1.2)}
    .ras-ring-wrap:hover{border-color:rgba(255,107,0,0.4);box-shadow:0 0 30px rgba(255,107,0,0.15)}
    .ras-ring{position:relative;width:90px;height:90px}
    .ras-ring svg{transform:rotate(-90deg)}
    .ras-ring-bg{fill:none;stroke:rgba(255,255,255,0.06);stroke-width:6}
    .ras-ring-fill{fill:none;stroke-width:6;stroke-linecap:round;stroke-dasharray:245;stroke-dashoffset:245;transition:stroke-dashoffset 1.5s ease}
    .ras-ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:1.1rem;font-weight:700;color:#fff}
    .ras-ring-name{font-size:.85rem;font-weight:600;color:#fff;text-align:center}
    .ras-ring-pos{font-size:.7rem;color:var(--text-muted)}
    .ras-summary{background:var(--card-bg);border:var(--card-border);border-radius:var(--radius);padding:24px;margin-top:32px;text-align:center;font-size:.95rem;color:var(--text-muted)}
    .ras-summary strong{color:var(--accent)}
    .ras-table-wrap{overflow-x:auto;margin-top:32px}
    .ras-table{width:100%;border-collapse:collapse;font-size:.85rem}
    .ras-table th{background:rgba(255,107,0,0.1);color:var(--accent);padding:12px 16px;text-align:left;font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}
    .ras-table td{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.04);color:var(--text-muted)}
    .ras-table tr:hover td{background:rgba(255,107,0,0.03)}
    /* MEASURABLES */
    .measurables-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-top:40px}
    .measurable-card{background:var(--card-bg);border:var(--card-border);border-radius:var(--radius);padding:24px;text-align:center;backdrop-filter:blur(20px) saturate(1.2);transition:border-color .3s}
    .measurable-card:hover{border-color:rgba(255,107,0,0.3)}
    .measurable-card .metric-value{font-size:2rem;font-weight:700;color:var(--accent)}
    .measurable-card .metric-label{font-size:.85rem;color:#fff;font-weight:600;margin-top:8px}
    .measurable-card .metric-sub{font-size:.75rem;color:var(--text-muted);margin-top:4px}
    /* STAFF */
    .coach-hero{display:grid;grid-template-columns:300px 1fr;gap:32px;align-items:center;background:var(--card-bg);border:var(--card-border);border-radius:16px;overflow:hidden;margin-bottom:40px;backdrop-filter:blur(20px) saturate(1.2)}
    .coach-hero img{width:100%;height:360px;object-fit:cover}
    .coach-hero-info{padding:32px}
    .coach-hero-info h3{font-family:'Oswald',sans-serif;font-size:1.8rem;font-weight:700;margin-bottom:4px}
    .coach-hero-info .coach-role{color:var(--accent);font-size:.85rem;font-weight:600;margin-bottom:12px}
    .coach-hero-info p{color:var(--text-muted);font-size:.9rem;line-height:1.7}
    .coaches-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
    .coach-card{background:var(--card-bg);border:var(--card-border);border-radius:var(--radius);padding:24px;backdrop-filter:blur(20px) saturate(1.2);transition:border-color .3s,box-shadow .3s}
    .coach-card:hover{border-color:rgba(255,107,0,0.35);box-shadow:0 0 30px rgba(255,107,0,0.1)}
    .coach-name{font-size:1.1rem;font-weight:700;margin-bottom:4px}
    .coach-role{color:var(--accent);font-size:.8rem;font-weight:600;margin-bottom:8px}
    .coach-card p{color:var(--text-muted);font-size:.85rem}
    @media(max-width:768px){.coach-hero{grid-template-columns:1fr}.coach-hero img{height:250px}}
    /* TESTIMONIALS */
    .testimonials-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:40px}
    .testimonial-card{background:var(--card-bg);border:var(--card-border);border-radius:var(--radius);padding:28px;backdrop-filter:blur(20px) saturate(1.2);transition:border-color .3s}
    .testimonial-card:hover{border-color:rgba(255,107,0,0.25)}
    .testimonial-card blockquote{font-size:.92rem;color:#ddd;line-height:1.7;margin-bottom:16px;font-style:italic}
    .testimonial-card cite{font-size:.8rem;color:var(--accent);font-style:normal;font-weight:600}
    /* RECOVERY */
    .recovery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:40px}
    .recovery-card{background:var(--card-bg);border:var(--card-border);border-radius:var(--radius);overflow:hidden}
    .recovery-card summary{padding:20px 24px;font-weight:600;cursor:pointer;color:#fff;font-size:.95rem;list-style:none;display:flex;justify-content:space-between;align-items:center;transition:color .2s}
    .recovery-card summary:hover{color:var(--accent)}
    .recovery-card summary::after{content:"＋";font-size:1.2rem;color:var(--accent)}
    .recovery-card[open] summary::after{content:"－"}
    .recovery-card .recovery-body{padding:0 24px 20px;color:var(--text-muted);font-size:.88rem;line-height:1.7}
    /* PACKAGES */
    #packages{padding:100px 0}
    .packages-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:60px}
    .package-card{background:var(--card-bg);border:var(--card-border);border-radius:16px;padding:40px 32px;display:flex;flex-direction:column;transition:border-color .3s,transform .3s,box-shadow .3s;backdrop-filter:blur(20px) saturate(1.2);position:relative;overflow:hidden}
    .package-card:hover{transform:translateY(-8px);box-shadow:0 20px 60px rgba(0,0,0,0.5)}
    .package-card.popular{border-color:rgba(255,107,0,0.5);box-shadow:0 0 40px rgba(255,107,0,0.15)}
    .popular-badge{position:absolute;top:20px;right:20px;background:var(--accent);color:#fff;font-size:.65rem;font-weight:700;letter-spacing:.1em;padding:4px 10px;border-radius:20px;text-transform:uppercase}
    .package-tier{font-size:.7rem;letter-spacing:.15em;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
    .package-name{font-size:1.8rem;font-weight:700;color:#fff;margin-bottom:12px}
    .package-price{font-size:.95rem;color:var(--text-muted);margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid rgba(255,255,255,0.07)}
    .package-features{list-style:none;flex:1;display:flex;flex-direction:column;gap:12px;margin-bottom:32px}
    .package-features li{display:flex;align-items:flex-start;gap:10px;font-size:.88rem;color:#ccc}
    .package-features li::before{content:"✓";color:var(--accent);font-weight:700;flex-shrink:0}
    .package-cta{background:transparent;border:1px solid rgba(255,255,255,0.15);color:#fff;padding:14px 24px;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .3s;text-align:center;display:block;font-family:'Inter',sans-serif}
    .package-cta:hover{background:rgba(255,107,0,0.1);border-color:var(--accent)}
    .package-card.popular .package-cta{background:var(--accent);border-color:var(--accent)}
    .package-card.popular .package-cta:hover{background:var(--accent-hover)}
    @media(max-width:768px){.packages-grid{grid-template-columns:1fr}}
    /* CONTACT */
    .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:40px}
    .contact-info{display:flex;flex-direction:column;gap:24px}
    .info-item{display:flex;align-items:center;gap:16px}
    .info-icon{width:48px;height:48px;background:var(--accent-dim);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
    .info-text h4{font-size:.95rem;font-weight:600;color:#fff}
    .info-text p{color:var(--text-muted);font-size:.88rem}
    .contact-form{display:flex;flex-direction:column;gap:16px}
    .form-group{display:flex;flex-direction:column;gap:6px}
    .form-group label{font-size:.8rem;font-weight:600;color:var(--text-muted);transition:color .2s}
    .form-group input,.form-group textarea{padding:12px 16px;background:var(--card-bg);border:var(--card-border);border-radius:8px;color:#fff;font-size:.9rem;font-family:inherit;transition:border-color .2s,box-shadow .2s}
    .form-group input:focus,.form-group textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,107,0,0.15);outline:none}
    .form-group textarea{min-height:120px;resize:vertical}
    .submit-btn{background:var(--accent);color:#fff;padding:14px;border-radius:8px;font-size:.95rem;font-weight:700;border:none;cursor:pointer;transition:background .2s;font-family:inherit}
    .submit-btn:hover{background:var(--accent-hover)}
    .submit-btn:active{transform:scale(0.97)}
    @media(max-width:768px){.contact-grid{grid-template-columns:1fr}}
    /* MOBILE CTA BAR */
    #mobile-cta-bar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:1000;background:rgba(10,10,10,0.92);backdrop-filter:blur(20px) saturate(1.2);border-top:1px solid rgba(255,107,0,0.3);padding:12px 20px;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;transform:translateY(100%);transition:transform .4s ease}
    #mobile-cta-bar.visible{transform:translateY(0)}
    .mobile-cta-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:12px 20px;font-size:.85rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap}
    .mobile-cta-phone{color:#fff;font-size:.9rem;font-weight:600}
    .mobile-cta-phone a{color:inherit}
    @media(max-width:760px){#mobile-cta-bar{display:flex}body{padding-bottom:70px}}
    /* PRELOADER */
    #preloader{position:fixed;inset:0;z-index:99999;background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s,visibility .6s}
    #preloader.hidden{opacity:0;visibility:hidden}
    .preloader-logo{font-family:'Oswald',sans-serif;font-size:3rem;font-weight:700;color:#fff;letter-spacing:.1em}
    .preloader-logo span{color:var(--accent)}
    .preloader-glow{width:80px;height:80px;border:2px solid var(--accent);border-radius:50%;margin-bottom:24px;animation:preloader-pulse 1.5s ease-in-out infinite;display:flex;align-items:center;justify-content:center}
    .preloader-text{margin-top:16px;font-size:.75rem;letter-spacing:.4em;color:#666;animation:preloader-letters 1.5s ease-in-out infinite}
    @keyframes preloader-pulse{0%,100%{box-shadow:0 0 20px rgba(255,107,0,0.3);transform:scale(1)}50%{box-shadow:0 0 40px rgba(255,107,0,0.6);transform:scale(1.05)}}
    @keyframes preloader-letters{0%,100%{opacity:.4;letter-spacing:.4em}50%{opacity:1;letter-spacing:.6em}}
    /* FILM GRAIN */
    body::after{content:"";position:fixed;inset:0;z-index:9998;pointer-events:none;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px}
    /* GRADIENT MESH */
    body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 800px 600px at 20% 20%,rgba(255,107,0,0.06) 0%,transparent 60%),radial-gradient(ellipse 600px 800px at 80% 80%,rgba(255,107,0,0.04) 0%,transparent 60%);animation:mesh-shift 12s ease-in-out infinite alternate}
    @keyframes mesh-shift{0%{opacity:.8}50%{opacity:1}100%{opacity:.8}}
    /* REVEAL */
    .reveal{opacity:0;transform:translateY(30px);transition:opacity .6s,transform .6s}
    .reveal.visible{opacity:1;transform:none}
    /* FOCUS */
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    /* REDUCED MOTION */
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}.reveal{opacity:1;transform:none}}
    /* FOOTER */
    .footer{padding:40px 0;border-top:1px solid rgba(255,255,255,0.06);text-align:center;font-size:.8rem;color:var(--text-muted)}
  </style>
</head>
